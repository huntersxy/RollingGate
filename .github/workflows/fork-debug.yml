name: Fork Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - stonecutter
      - releases/**
  pull_request:
    branches:
      - stonecutter
      - releases/**

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mcversion: "1.21.1", mc-index: 0, java: "21" }
          - { mcversion: "1.21.8", mc-index: 1, java: "21" }
          - { mcversion: "1.21.10", mc-index: 2, java: "21" }
          - { mcversion: "26.1.2", mc-index: 3, java: "25" }
          - { mcversion: "26.2", mc-index: 4, java: "25" }
    env:
      CI_BUILD: false
      PR_BUILD: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Mod version
        id: mod_version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: versions/${{ matrix.mcversion }}/gradle.properties
          properties: 'minecraft_version neo_version'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build RollingGate
        run: ./gradlew :${{ matrix.mcversion }}:clean :${{ matrix.mcversion }}:build -Pbuild_label=build.${{ github.run_number }}.${{ matrix.mc-index }}

      - name: Locate artifact
        id: artifact
        shell: bash
        run: |
          jar=$(find versions/${{ matrix.mcversion }}/build/libs -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*sources*' -print -quit)
          test -n "$jar"
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: RollingGate-${{ matrix.mcversion }}-v${{ steps.mod_version.outputs.value }}-build-${{ github.run_number }}
          path: versions/${{ matrix.mcversion }}/build/libs/${{ steps.artifact.outputs.name }}

      - name: GameTest
        timeout-minutes: 15
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        with:
          minecraft_version: ${{ steps.properties.outputs.minecraft_version }}
          mod_loader: neoforge
          loader_version: ${{ steps.properties.outputs.neo_version }}
          mods: versions/${{ matrix.mcversion }}/build/libs/${{ steps.artifact.outputs.name }}
